<!doctype html>
<html lang="tr" data-font="sans" data-size="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çağrı Notepad — kaybolmayan not defteri</title>
<meta name="description" content="Aç, yaz, kapat. Yazdığın kendiliğinden kaydedilir ve geri döndüğünde tam bıraktığın yerde durur. Hesap yok, reklam yok, veri tarayıcından çıkmaz.">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Çağrı Notepad">
<meta property="og:description" content="Aç, yaz, kapat. Yazdığın kendiliğinden kaydedilir.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script>
/* Tema/tipografi tercihini boyamadan önce uygula — açılışta yanıp sönme olmasın. */
(function () {
  try {
    var p = 'cagrinotepad:v1:', d = document.documentElement, g = function (k) { return localStorage.getItem(p + k); };
    var t = g('theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t;
    var f = g('font');  if (f) d.dataset.font = f;
    var s = g('size');  if (s) d.dataset.size = s;
    var l = g('lang');  if (l) d.lang = l;
  } catch (e) {}
})();
</script>
</head>
<body>

<main class="sheet">
  <textarea id="editor"
    autofocus
    autocomplete="off"
    autocapitalize="sentences"
    spellcheck="false"
    aria-label="Not"></textarea>
</main>

<p class="status" id="status" role="status" aria-live="polite"></p>

<footer class="bar">
  <div class="tools" role="toolbar" aria-label="Ayarlar">
    <button type="button" id="t-theme" class="tool" aria-label="Tema">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path class="i-sun" d="M10 3.2v1.6M10 15.2v1.6M3.2 10h1.6M15.2 10h1.6M5.2 5.2l1.1 1.1M13.7 13.7l1.1 1.1M14.8 5.2l-1.1 1.1M6.3 13.7l-1.1 1.1"/><circle class="i-sun" cx="10" cy="10" r="3.4"/><path class="i-moon" d="M15.4 12.3A6 6 0 0 1 7.7 4.6a6 6 0 1 0 7.7 7.7Z"/></svg>
    </button>
    <button type="button" id="t-font" class="tool" aria-label="Yazı tipi">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.6 15.4 8 4.6h1.2l4.4 10.8M5.4 11.6h6.6"/><path d="M14.4 15.4h2.2"/></svg>
    </button>
    <button type="button" id="t-smaller" class="tool" aria-label="Yazıyı küçült">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
    </button>
    <button type="button" id="t-bigger" class="tool" aria-label="Yazıyı büyüt">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="t-download" class="tool" aria-label="Metni indir">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.6v8.2M6.6 8.6 10 12l3.4-3.4M4.4 15.2h11.2"/></svg>
    </button>
    <button type="button" id="t-restore" class="tool" aria-label="Yedeği geri yükle" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.6 8.4A5.8 5.8 0 1 1 4.4 12"/><path d="M4.2 4.6v3.9h3.9"/></svg>
    </button>
    <button type="button" id="t-lang" class="tool tool--text" aria-label="Dili değiştir">EN</button>
  </div>
  <p class="count" id="count"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
